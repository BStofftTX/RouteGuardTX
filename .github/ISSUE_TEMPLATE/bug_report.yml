name: Bug report
description: Report a reproducible RouteGuardTX problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic route data. Do not include credentials, private trip history, or restricted datasets.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, RouteGuardTX commit, and routing mode.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, privacy, or security impact
      description: Describe any incorrect warning, route representation, data exposure, or credential risk.
